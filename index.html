<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindEase — take the stress off your chest</title>
  <meta name="description" content="MindEase — a mental wellness app demo: mood check-ins, a mood log, appointments, support chat, articles, and a calming store. Accessible, mobile-first web version of a Figma prototype by Sefunmi Akin-Olukunle.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d2a7c">
  <link rel="icon" href="images/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MindEase">
  <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>

  <header class="app-header">
    <div class="bar">
      <a class="brand-mini" href="#" data-nav="menu" id="brand-link" aria-label="MindEase home">
        <img src="images/sleepy-taco.png" alt="" width="34" height="33" style="border-radius:8px">
        MindEase
      </a>
      <div class="hdr-actions">
        <button class="icon-btn" id="back-btn" type="button" aria-label="Go back" hidden>←</button>
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Main menu" hidden>☰</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="off"></main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
</body>
</html>
